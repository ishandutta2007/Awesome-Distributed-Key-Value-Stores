<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d172e"/>
      <stop offset="100%" stop-color="#080c17"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 40px; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 16px; fill: #94a3b8; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #38bdf8; letter-spacing: 0.5px; }
    .node-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #cbd5e1; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-gradient)"/>
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle Network Grid Pattern in Background -->
  <g opacity="0.15">
    <circle cx="100" cy="60" r="2" fill="#38bdf8"/>
    <circle cx="300" cy="40" r="2" fill="#818cf8"/>
    <circle cx="500" cy="80" r="2" fill="#38bdf8"/>
    <circle cx="700" cy="50" r="2" fill="#818cf8"/>
    <circle cx="900" cy="70" r="2" fill="#38bdf8"/>
    <circle cx="1100" cy="40" r="2" fill="#818cf8"/>
    <line x1="100" y1="60" x2="300" y2="40" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="300" y1="40" x2="500" y2="80" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="700" y1="50" x2="900" y2="70" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="900" y1="70" x2="1100" y2="40" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Dynamic Distributed Cluster Visualization (Right Side / Background) -->
  <g id="consensus-mesh" opacity="0.8">
    <!-- Connecting lines between distributed nodes -->
    <line x1="770" y1="100" x2="950" y2="70" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="950" y1="70" x2="1110" y2="110" stroke="#818cf8" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="0" to="24" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="770" y1="100" x2="840" y2="230" stroke="#c084fc" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="840" y1="230" x2="1040" y2="240" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="0" to="24" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="1040" y1="240" x2="1110" y2="110" stroke="#818cf8" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="3.5s" repeatCount="indefinite"/>
    </line>
    <line x1="950" y1="70" x2="840" y2="230" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4">
      <animate attributeName="stroke-dashoffset" from="16" to="0" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="950" y1="70" x2="1040" y2="240" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4">
      <animate attributeName="stroke-dashoffset" from="0" to="16" dur="2.8s" repeatCount="indefinite"/>
    </line>

    <!-- Animated Data Pulses moving along network lines -->
    <circle r="4" fill="#38bdf8" filter="url(#glow)">
      <animateMotion path="M 770 100 L 950 70" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#818cf8" filter="url(#glow)">
      <animateMotion path="M 950 70 L 1110 110" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#c084fc" filter="url(#glow)">
      <animateMotion path="M 840 230 L 1040 240" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#38bdf8" filter="url(#glow)">
      <animateMotion path="M 1040 240 L 1110 110" dur="3.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Distributed Nodes (Pill Containers) -->
    <!-- Node 1: Leader (Raft / Zab) -->
    <g transform="translate(950, 70)">
      <rect x="-65" y="-22" width="130" height="44" rx="10" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
      <circle cx="-42" cy="0" r="6" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="-26" y="-3" class="node-text">Leader (CP)</text>
      <text x="-26" y="12" class="badge-text">Raft Quorum</text>
    </g>

    <!-- Node 2: Follower A -->
    <g transform="translate(770, 100)">
      <rect x="-55" y="-20" width="110" height="40" rx="8" fill="url(#card-grad)" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="-36" cy="0" r="5" fill="#38bdf8"/>
      <text x="-22" y="-2" class="node-text">etcd v3</text>
      <text x="-22" y="11" class="badge-text">Follower</text>
    </g>

    <!-- Node 3: Follower B -->
    <g transform="translate(1110, 110)">
      <rect x="-55" y="-20" width="110" height="40" rx="8" fill="url(#card-grad)" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="-36" cy="0" r="5" fill="#818cf8"/>
      <text x="-22" y="-2" class="node-text">Consul</text>
      <text x="-22" y="11" class="badge-text">Follower</text>
    </g>

    <!-- Node 4: Learner / Replica C -->
    <g transform="translate(840, 230)">
      <rect x="-60" y="-20" width="120" height="40" rx="8" fill="url(#card-grad)" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="-40" cy="0" r="5" fill="#c084fc"/>
      <text x="-25" y="-2" class="node-text">Redis / TiKV</text>
      <text x="-25" y="11" class="badge-text">Memory Grid</text>
    </g>

    <!-- Node 5: Learner / Replica D -->
    <g transform="translate(1040, 240)">
      <rect x="-60" y="-20" width="120" height="40" rx="8" fill="url(#card-grad)" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="-40" cy="0" r="5" fill="#38bdf8"/>
      <text x="-25" y="-2" class="node-text">ZooKeeper</text>
      <text x="-25" y="11" class="badge-text">Zab Ensemble</text>
    </g>
  </g>

  <!-- Foreground Main Title & Subtitle Section (Cleanly positioned on Left) -->
  <g transform="translate(60, 65)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="285" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.95"/>
    <circle cx="14" cy="14" r="4" fill="#38bdf8">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="18" class="tag">DISTRIBUTED SYSTEMS &amp; STORAGE</text>

    <!-- Main Title -->
    <text x="0" y="72" class="title">Awesome Distributed</text>
    <text x="0" y="122" class="title" fill="url(#accent-grad)" style="fill: url(#accent-grad);">Key-Value Stores</text>

    <!-- Subtitle -->
    <text x="0" y="160" class="subtitle">Curated Consensus Protocols, Service Discovery, In-Memory Grids &amp; Distributed KV</text>

    <!-- Bottom Feature Pills -->
    <g transform="translate(0, 185)">
      <!-- Pill 1: Consensus -->
      <g transform="translate(0, 0)">
        <rect width="130" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="14" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">⚡ Raft &amp; Zab</text>
      </g>
      <!-- Pill 2: Service Discovery -->
      <g transform="translate(142, 0)">
        <rect width="155" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="14" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#818cf8">🔍 Service Discovery</text>
      </g>
      <!-- Pill 3: Strong Consistency -->
      <g transform="translate(309, 0)">
        <rect width="165" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="14" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#c084fc">🔒 Strong Consistency</text>
      </g>
    </g>
  </g>
</svg>